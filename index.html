<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PÁRAMO | Salsas y Conservas Artesanales</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --crema: #F7F3EE;
            --terracota: #8B4513;
            --blanco: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Lato', sans-serif; background-color: var(--crema); }

        nav {
            padding: 0 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--crema);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            height: 70px;
        }

        .logo-pequeno img { height: 45px; width: auto; }

        .nav-links a {
            text-decoration: none;
            color: #333;
            margin-left: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .hero {
            height: 100vh;
            /* RUTA UNIVERSAL: Busca la imagen en la carpeta actual o una atrás */
            background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), 
                        url('image_7a52ca.jpg') no-repeat center center,
                        url('../image_7a52ca.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .social-icons {
            position: absolute;
            top: 30px;
            right: 5%;
            z-index: 10;
        }

        .social-icons a { color: var(--blanco); margin-left: 15px; font-size: 1.1rem; }

        .content { position: relative; z-index: 5; text-align: center; color: var(--blanco); width: 90%; }
        
        .logo-central {
            width: clamp(120px, 15vw, 160px);
            margin-bottom: 10px;
        }

        .content h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            letter-spacing: 5px;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 10px;
        }

        .content p {
            font-size: clamp(0.8rem, 1.5vw, 1rem);
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .btn-explorar {
            background: var(--terracota);
            color: white;
            padding: 14px 35px;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .nav-links { display: none; }
            .hero { background-position: center; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo-pequeno">
            <img src="LOGO SIN FONDO (1).png" alt="Páramo">
        </div>
        <div class="nav-links">
            <a href="#">Historia</a>
            <a href="#">Cosecha</a>
            <a href="#">Contacto</a>
        </div>
    </nav>

    <section class="hero">
        <div class="social-icons">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="far fa-envelope"></i></a>
        </div>

        <div class="content">
            <img src="LOGO SIN FONDO (1).png" alt="Páramo" class="logo-central">
            <h1>PÁRAMO</h1>
            <p>Sabor y origen en un mismo frasco</p>
            <a href="#" class="btn-explorar">Explorar Catálogo</a>
        </div>
    </section>

</body>
</html>
