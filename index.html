<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PÁRAMO | Salsas y Conservas Artesanales</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --crema: #F7F3EE;
            --terracota: #8B4513;
            --blanco: #ffffff;
            --verde-obscuro: #2D3A27;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Lato', sans-serif; background-color: var(--crema); color: #333; }

        /* --- NAVEGACIÓN --- */
        nav {
            padding: 0 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--crema);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            height: 70px;
        }

        .logo-pequeno img { height: 45px; width: auto; }

        .nav-links a {
            text-decoration: none;
            color: #333;
            margin-left: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        /* --- HERO (FOTO DE FONDO RESPONSIVA) --- */
        .hero {
            height: 100vh;
            /* Usamos la imagen que subiste para asegurar que cargue */
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('image_7a52ca.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .content { position: relative; z-index: 5; text-align: center; color: var(--blanco); width: 90%; }
        
        .logo-central {
            width: clamp(130px, 20vw, 190px);
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
        }

        .content h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.8rem, 8vw, 5rem);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .content p {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .btn-explorar {
            background: var(--terracota);
            color: white;
            padding: 15px 35px;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 1px;
            display: inline-block;
        }

        /* --- SECCIONES INFERIORES --- */
        .section { padding: 80px 10%; text-align: center; }
        
        .section h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--verde-obscuro);
            margin-bottom: 25px;
        }

        /* --- MÓVIL --- */
        @media (max-width: 600px) {
            .nav-links { display: none; } /* Mantiene la estética limpia en móvil */
            .hero { background-attachment: scroll; } /* Mejor rendimiento en celulares */
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo-pequeno">
            <img src="LOGO SIN FONDO (1).jpg" alt="Páramo">
        </div>
        <div class="nav-links">
            <a href="#historia">Historia</a>
            <a href="#cosecha">Cosecha</a>
            <a href="#contacto">Contacto</a>
        </div>
    </nav>

    <section class="hero">
        <div class="content">
            <img src="LOGO SIN FONDO (1).jpg" alt="Sello Páramo" class="logo-central">
            <h1>PÁRAMO</h1>
            <p>Sabor y origen en un mismo frasco</p>
            <a href="#cosecha" class="btn-explorar">Explorar Cosecha</a>
        </div>
    </section>

    <section id="historia" class="section">
        <h2>Nuestra Historia</h2>
        <p>Artesanía y tradición bajacaliforniana en cada proceso.</p>
    </section>

    <section id="cosecha" class="section" style="background-color: white;">
        <h2>La Cosecha</h2>
        <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;">
             <img src="image.png" style="width: 300px; border-radius: 5px;" alt="Mermelada">
        </div>
    </section>

</body>
</html>
