<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PÁRAMO | Salsas y Conservas Artesanales</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --crema: #F7F3EE;
            --terracota: #8B4513;
            --blanco: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { font-family: 'Lato', sans-serif; background-color: var(--crema); }

        /* --- NAVEGACIÓN --- */
        nav {
            padding: 0 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--crema);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            height: 70px; /* Altura fija para consistencia */
        }

        .logo-pequeno img { height: 45px; width: auto; vertical-align: middle; }

        .nav-links a {
            text-decoration: none;
            color: #333;
            margin-left: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        /* --- SECCIÓN HERO (FOTO DE FONDO) --- */
        .hero {
            height: 100vh;
            /* Asegura que la foto siempre cubra la pantalla sin estirarse */
            background: url('fondo-artesanal.jpg') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding-top: 70px; /* Compensa la barra de navegación */
        }

        /* Capa de oscurecimiento para legibilidad */
        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.2);
        }

        /* Iconos de Redes (Esquina superior derecha de la foto) */
        .social-icons {
            position: absolute;
            top: 30px;
            right: 5%;
            z-index: 10;
        }

        .social-icons a {
            color: var(--blanco);
            margin-left: 15px;
            font-size: 1.2rem;
            text-decoration: none;
        }

        /* --- CONTENIDO CENTRAL --- */
        .content {
            position: relative;
            z-index: 5;
            text-align: center;
            color: var(--blanco);
            width: 90%;
            max-width: 800px;
        }

        .logo-central {
            width: clamp(120px, 15vw, 180px); /* Tamaño fluido según pantalla */
            margin-bottom: 5px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
        }

        .content h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 7vw, 4.5rem); /* Se ajusta de móvil a PC solo */
            letter-spacing: clamp(2px, 1vw, 6px);
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 10px;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.4);
        }

        .content p {
            font-size: clamp(0.85rem, 1.5vw, 1.1rem);
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .btn-explorar {
            background: var(--terracota);
            color: white;
            padding: 14px 35px;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: 0.3s ease;
            display: inline-block;
        }

        .btn-explorar:hover {
            background: #6D360F;
            transform: scale(1.05);
        }

        /* --- AJUSTES PARA MÓVIL --- */
        @media (max-width: 600px) {
            nav { justify-content: center; } /* Centra el logo pequeño en móvil */
            .nav-links { display: none; }    /* Oculta links para no saturar la pantalla pequeña */
            .social-icons { top: 20px; }
            .hero { background-position: 65% center; } /* Mueve un poco la foto para centrar el interés */
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo-pequeno">
            <img src="LOGO SIN FONDO (1).png" alt="Páramo">
        </div>
        <div class="nav-links">
            <a href="#historia">Historia</a>
            <a href="#cosecha">Cosecha</a>
            <a href="#contacto">Contacto</a>
        </div>
    </nav>

    <section class="hero">
        <div class="social-icons">
            <a href="https://instagram.com/paramo.enfrasco" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="mailto:salsasyconservasparamo@gmail.com"><i class="far fa-envelope"></i></a>
        </div>

        <div class="content">
            <img src="LOGO SIN FONDO (1).png" alt="Sello Páramo" class="logo-central">
            <h1>PÁRAMO</h1>
            <p>Sabor y origen en un mismo frasco</p>
            <a href="#" class="btn-explorar">Explorar Catálogo</a>
        </div>
    </section>

</body>
</html>
