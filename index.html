<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PÁRAMO | Salsas y Conservas Artesanales</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --crema: #F7F3EE;
            --terracota: #8B4513;
            --blanco: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { font-family: 'Lato', sans-serif; background-color: var(--crema); overflow-x: hidden; }

        /* --- MENÚ SUPERIOR --- */
        nav {
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--crema);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .logo-pequeno img { height: 45px; width: auto; }

        .nav-links a {
            text-decoration: none;
            color: #333;
            margin-left: 25px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        /* --- SECCIÓN PRINCIPAL (HERO) --- */
        .hero {
            height: 100vh;
            background: url('fondo-artesanal.jpg') no-repeat center center/cover;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-top: 60px; /* Espacio para el nav */
        }

        /* Capa de oscurecimiento sutil */
        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.25);
        }

        /* Iconos de Redes arriba a la derecha de la foto */
        .social-icons {
            position: absolute;
            top: 40px;
            right: 5%;
            z-index: 10;
        }

        .social-icons a {
            color: var(--blanco);
            margin-left: 15px;
            font-size: 1.2rem;
            text-decoration: none;
            opacity: 0.9;
        }

        /* Contenido Central */
        .content {
            position: relative;
            z-index: 5;
            text-align: center;
            color: var(--blanco);
        }

        .logo-central {
            width: 180px;
            margin-bottom: -10px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.4);
        }

        .content p {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 35px;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }

        .btn-explorar {
            background: var(--terracota);
            color: white;
            padding: 16px 40px;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: 0.3s;
            border-radius: 2px;
            display: inline-block;
        }

        .btn-explorar:hover {
            background: #6D360F;
            transform: translateY(-3px);
        }

        /* Adaptación móvil */
        @media (max-width: 768px) {
            .content h1 { font-size: 3rem; }
            .logo-central { width: 130px; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo-pequeno">
            <img src="LOGO SIN FONDO (1).png" alt="Páramo">
        </div>
        <div class="nav-links">
            <a href="#historia">Historia</a>
            <a href="#cosecha">Cosecha</a>
            <a href="#contacto">Contacto</a>
        </div>
    </nav>

    <section class="hero">
        <div class="social-icons">
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="far fa-envelope"></i></a>
        </div>

        <div class="content">
            <img src="LOGO SIN FONDO (1).png" alt="Sello Páramo" class="logo-central">
            <h1>PÁRAMO</h1>
            <p>Sabor y origen en un mismo frasco</p>
            <a href="#" class="btn-explorar">Explorar Catálogo</a>
        </div>
    </section>

</body>
</html>
